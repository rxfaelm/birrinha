<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante da Birrinha</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --verde: #10b981;
            --preto: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--preto);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* AQUI ESTÁ A CORREÇÃO DEFINITIVA */
        .nome-correto {
            /* Força a fonte elegante */
            font-family: 'Playfair Display', serif !important;
            font-style: italic !important;
            
            /* FORÇA A SAIR DA CAIXA ALTA */
            text-transform: none !important; 
            font-variant: normal !important;
            font-weight: 700 !important;
            
            /* Ajuste de respiro entre letras */
            letter-spacing: 0px !important;
        }

        /* Estilo da Nav */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: 0.4s;
        }

        nav.scrolled {
            background: rgba(0, 0, 0, 0.98);
            padding: 15px 50px;
            border-bottom: 1px solid #222;
        }

        .nav-brand {
            font-size: 1.5rem;
            color: var(--verde);
            opacity: 0;
            transition: 0.3s;
        }

        nav.scrolled .nav-brand { opacity: 1; }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://lh3.googleusercontent.com/gps-cs-s/AHVAweqJHSJQvDus9Q6TS4h8Ak_HXMW10tF_ZrI_z-bmzWhlJiQPGEc2nhuDe9bRf0hSuqapXyGZb22pW2qJMDDL8ypm5x527iUWCxp9d7gWirv1QA4gZquLjyDWHPHNsQiXfaVOiBdk6Q=w289-h312-n-k-no');
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: clamp(3rem, 10vw, 6rem); /* Fonte que se ajusta ao tamanho da tela */
            line-height: 1.1;
            margin-top: 20px;
        }

        .hero h1 span { color: var(--verde); }

        .btn-whatsapp {
            margin-top: 40px;
            background: var(--verde);
            color: white;
            padding: 18px 45px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        /* Mobile */
        @media (max-width: 768px) {
            nav { padding: 20px; }
            nav.scrolled { padding: 15px 20px; }
            .hero h1 { font-size: 3.5rem; }
            .nav-brand { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="nav-brand nome-correto">Restaurante da Birrinha</div>
        <a href="https://wa.me/5563992641584" style="background: var(--verde); color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 0.8rem;">RESERVAR</a>
    </nav>

    <section class="hero">
        <img src="https://drive.google.com/thumbnail?id=1MuB3e9DkKcZwyH-ajXOXZPG-9Xx-deuK&sz=w300" style="width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--verde);">
        
        <p style="text-transform: uppercase; letter-spacing: 4px; font-size: 0.7rem; color: var(--verde); margin-top: 20px;">Sabor Caseiro em Araguaína</p>
        
        <h1 class="nome-correto">
            Restaurante da <br> <span>Birrinha</span>
        </h1>

        <a href="https://wa.me/5563992641584" class="btn-whatsapp">Chamar no WhatsApp</a>
    </section>

    <script>
        // Script para mostrar a nav no scroll
        window.onscroll = function() {
            var navbar = document.getElementById("navbar");
            if (window.pageYOffset > 100) {
                navbar.classList.add("scrolled");
            } else {
                navbar.classList.remove("scrolled");
            }
        };
    </script>

</body>
</html>
